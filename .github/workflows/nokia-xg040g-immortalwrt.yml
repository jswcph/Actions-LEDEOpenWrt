name: Build Nokia XG-040G MF/MD - ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "选择要编译的 Nokia XG-040G 型号"
        required: true
        type: choice
        default: mf-ubi
        options:
          - mf-ubi
          - mf
          - md
          - md-ubi

  schedule:
    # 每周日北京时间凌晨 3 点
    # UTC = 前一天 19:00
    - cron: "0 19 * * 6"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:

  build:
    name: ${{ github.event.inputs.device || 'mf-ubi' }} - ImmortalWrt
    runs-on: ubuntu-24.04

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动运行：使用 Run workflow 选择的分支。
          # 定时运行：Workflow 由 main 触发，因此固定使用实际编译分支。
          ref: ${{ github.event_name == 'schedule' && 'xg040g-immortalwrt' || github.ref }}

      - name: Set Build Repository Revision
        shell: bash
        run: |
          set -e

          BUILD_BRANCH="$(git branch --show-current)"
          BUILD_COMMIT="$(git rev-parse HEAD)"

          echo "BUILD_BRANCH=${BUILD_BRANCH}" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=${BUILD_COMMIT}" >> "$GITHUB_ENV"

          echo "Build repository branch: ${BUILD_BRANCH}"
          echo "Build repository commit: ${BUILD_COMMIT}"

      # =====================================================
      # 设置机型变量
      # =====================================================

      - name: Set Device Variables
        shell: bash
        run: |
          set -e

          DEVICE="${{ github.event.inputs.device || 'mf-ubi' }}"

          case "$DEVICE" in

            mf-ubi)
              echo "DEVICE_ID=mf-ubi" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MF-UBI" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MF UBI" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7583" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-mf-ubi" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi" >> "$GITHUB_ENV"
              ;;

            mf)
              echo "DEVICE_ID=mf" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MF" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MF" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7583" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-mf" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf" >> "$GITHUB_ENV"
              ;;

            md)
              echo "DEVICE_ID=md" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MD" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MD" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7581" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-md" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md" >> "$GITHUB_ENV"
              ;;

            md-ubi)
              echo "DEVICE_ID=md-ubi" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MD-UBI" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MD UBI" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7581" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-md-ubi" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi" >> "$GITHUB_ENV"
              ;;

            *)
              echo "ERROR: Unknown device: $DEVICE"
              exit 1
              ;;
          esac


      # =====================================================
      # 清理磁盘
      # =====================================================

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      # =====================================================
      # 安装编译依赖
      # =====================================================

      - name: Install Build Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            swig \
            time \
            libelf-dev \
            device-tree-compiler


      # =====================================================
      # Clone ImmortalWrt
      # =====================================================

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf openwrt

          git clone \
            --depth=1 \
            --branch master \
            https://github.com/immortalwrt/immortalwrt.git \
            openwrt

          cd openwrt

          echo "ImmortalWrt commit:"
          git log -1 --oneline

          test -f Makefile


      # =====================================================
      # 添加 Feeds
      # =====================================================

      - name: Add Feeds
        working-directory: openwrt
        run: |
          set -e

          # Passwall
          sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
          sed -i '1i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default

          # iStore
          echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default

          echo "========================================"
          echo "feeds.conf.default"
          echo "========================================"

          cat feeds.conf.default


      # =====================================================
      # 更新 Feeds
      # =====================================================

      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          set -e

          ./scripts/feeds clean

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # =====================================================
      # 安装 Passwall
      # =====================================================

      - name: Install Passwall
        working-directory: openwrt
        run: |
          set -e

          # 删除可能冲突的软件包
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls} 2>/dev/null || true

          rm -rf feeds/luci/applications/luci-app-passwall 2>/dev/null || true

          ./scripts/feeds update passwall_packages passwall_luci

          ./scripts/feeds install -a -p passwall_packages

          ./scripts/feeds install -a -p passwall_luci


      # =====================================================
      # 安装 iStore
      # =====================================================

      - name: Install iStore
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Update iStore feed"
          echo "========================================"

          ./scripts/feeds update istore

          echo "========================================"
          echo "Install iStore packages"
          echo "========================================"

          # iStore 当前源码结构：
          # feeds/istore/luci/luci-app-store/Makefile
          # luci-app-store 依赖 luci-lib-taskd 等组件。
          ./scripts/feeds install -d y -p istore luci-app-store

          echo "========================================"
          echo "Verify iStore source"
          echo "========================================"

          test -f "feeds/istore/luci/luci-app-store/Makefile"
          echo "OK: feeds/istore/luci/luci-app-store/Makefile"

          echo "========================================"
          echo "Verify installed feed package"
          echo "========================================"

          if [ ! -e "package/feeds/istore/luci-app-store/Makefile" ]; then
            echo "ERROR: package/feeds/istore/luci-app-store/Makefile was not installed."
            echo "Installed iStore packages:"
            find package/feeds/istore -maxdepth 2 -type f -name Makefile -print 2>/dev/null | sort || true
            exit 1
          fi

          ls -l "package/feeds/istore/luci-app-store/Makefile"

          echo "========================================"
          echo "Verify iStore dependencies"
          echo "========================================"

          for pkg in luci-lib-taskd luci-lib-xterm taskd; do
            if [ -e "package/feeds/istore/${pkg}/Makefile" ]; then
              echo "OK: ${pkg}"
            else
              echo "WARNING: ${pkg} Makefile not found in package/feeds/istore"
            fi
          done

          echo "========================================"
          echo "iStore package information"
          echo "========================================"

          grep -E 'LUCI_TITLE|LUCI_DEPENDS|LUCI_EXTRA_DEPENDS|PKG_VERSION' \
            feeds/istore/luci/luci-app-store/Makefile || true

      # =====================================================
      # Lucky
      # =====================================================

      - name: Add Lucky
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/lucky

          git clone \
            --depth=1 \
            https://github.com/gdy666/luci-app-lucky.git \
            package/lucky


      # =====================================================
      # OpenAppFilter
      # =====================================================

      - name: Add OpenAppFilter
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/OpenAppFilter

          git clone \
            --depth=1 \
            https://github.com/destan19/OpenAppFilter.git \
            package/OpenAppFilter


      # =====================================================
      # OpenClash
      # =====================================================

      - name: Add OpenClash
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-app-openclash
          rm -rf /tmp/OpenClash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          test -d /tmp/OpenClash/luci-app-openclash

          cp -rf \
            /tmp/OpenClash/luci-app-openclash \
            package/luci-app-openclash

          rm -rf /tmp/OpenClash


      # =====================================================
      # Argon
      # =====================================================

      - name: Add Argon
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-theme-argon
          rm -rf package/luci-app-argon-config

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config


      # =====================================================
      # 验证 Nokia Profile
      # =====================================================

      - name: Verify Nokia Device Profile
        working-directory: openwrt
        run: |
          set -e

          echo "Device: ${DEVICE_DESCRIPTION}"
          echo "Target: ${TARGET_SUBTARGET}"
          echo "Profile: ${TARGET_PROFILE}"

          if ! grep -R -q "${TARGET_PROFILE}" target/linux/airoha 2>/dev/null; then
            echo "ERROR: Profile not found:"
            echo "${TARGET_PROFILE}"
            exit 1
          fi


      # =====================================================
      # 使用仓库根目录 .config
      # =====================================================

      - name: Copy Custom Config
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          CONFIG_SOURCE="${GITHUB_WORKSPACE}/.config"

          echo "========================================"
          echo "Checking repository .config"
          echo "========================================"

          if [ ! -f "${CONFIG_SOURCE}" ]; then
            echo "ERROR: Repository root .config not found:"
            echo "${CONFIG_SOURCE}"
            echo "The .config file must be in the root of the selected GitHub branch."
            exit 1
          fi

          echo "Found: ${CONFIG_SOURCE}"
          wc -l "${CONFIG_SOURCE}"

          # 只从仓库根目录 .config 复制软件包配置。
          # 后面的 Add Device Target Config 只负责选择当前机型。
          cp -f "${CONFIG_SOURCE}" .config

          echo "========================================"
          echo "Custom .config copied to OpenWrt"
          echo "========================================"

          wc -l .config

          echo "========================================"
          echo "Required packages from repository .config"
          echo "========================================"

          REQUIRED_PACKAGES="
          CONFIG_PACKAGE_luci-app-store
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn
          "

          for pkg in $REQUIRED_PACKAGES; do
            if grep -q "^${pkg}=y$" .config; then
              echo "OK: ${pkg}=y"
            else
              echo "ERROR: ${pkg}=y is missing from repository .config"
              exit 1
            fi
          done

          echo "========================================"
          echo "Package configuration loaded from repository .config"
          echo "========================================"
      # =====================================================
      # 添加机型 Target 配置
      # =====================================================

      - name: Add Device Target Config
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          case "${DEVICE_ID}" in

            mf-ubi)
              cat >> .config <<'EOF'

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7583=y
          CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y
          EOF
              ;;

            mf)
              cat >> .config <<'EOF'

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7583=y
          CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf=y
          EOF
              ;;

            md)
              cat >> .config <<'EOF'

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y
          EOF
              ;;

            md-ubi)
              cat >> .config <<'EOF'

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          EOF
              ;;

            *)
              echo "ERROR: Unknown device"
              exit 1
              ;;
          esac


      # =====================================================
      # 默认网络配置
      # =====================================================

      - name: Add Default Network Config
        working-directory: openwrt
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-xg040g-defaults <<'EOF'
          #!/bin/sh

          uci set network.lan.ipaddr='192.168.6.1'
          uci set network.lan.netmask='255.255.255.0'

          uci -q delete network.wan
          uci set network.wan='interface'
          uci set network.wan.device='lan1'
          uci set network.wan.proto='dhcp'

          uci -q delete network.br_lan
          uci set network.br_lan='device'
          uci set network.br_lan.name='br-lan'
          uci set network.br_lan.type='bridge'

          uci add_list network.br_lan.ports='lan2'
          uci add_list network.br_lan.ports='lan3'
          uci add_list network.br_lan.ports='lan4'

          uci set network.lan.device='br-lan'

          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='150'
          uci set dhcp.lan.leasetime='12h'

          uci set system.@system[0].hostname='OpenWrt'

          uci set luci.main.lang='zh_cn'
          uci set luci.main.mediaurlbase='/luci-static/argon'

          uci commit system
          uci commit network
          uci commit dhcp
          uci commit luci

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-xg040g-defaults


      # =====================================================
      # 设置 Argon 默认主题
      # =====================================================

      - name: Set Argon Default Theme
        working-directory: openwrt
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-argon-default-theme <<'EOF'
          #!/bin/sh

          if [ -f /etc/config/luci ]; then
              uci set luci.main.mediaurlbase='/luci-static/argon'
              uci set luci.main.lang='zh_cn'
              uci commit luci
          fi

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/98-argon-default-theme


      # =====================================================
      # 默认 root 密码
      #
      # 当前先保持原来的 password。
      #
      # 后续如果 MD / MF 要不同密码，只需要修改这里。
      # =====================================================

      - name: Set Root Password
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          mkdir -p files/etc

          echo "========================================"
          echo "Setting root password"
          echo "========================================"

          # 使用 chpasswd 生成 shadow 密码
          # 这里暂时保持原 Workflow 的默认密码：password
          #
          # 注意：
          # 这个步骤是在构建 rootfs 前执行，
          # 最终会进入固件中的 /etc/shadow。

          sed -i '/^root:/d' files/etc/shadow 2>/dev/null || true

          if [ ! -f files/etc/passwd ]; then
            echo 'root:x:0:0:root:/root:/bin/ash' > files/etc/passwd
          fi

          echo 'root:password' | chpasswd -R files/etc

          echo "Root shadow entry:"
          grep '^root:' files/etc/shadow | sed 's/:.*:/:***:/'


      # =====================================================
      # Make Defconfig
      # =====================================================

      - name: Make Defconfig
        working-directory: openwrt
        run: |
          set -e

          make defconfig


      # =====================================================
      # 验证最终配置
      # =====================================================

      - name: Verify Final Config
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Target"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config || true

          echo "========================================"
          echo "Chinese Packages"
          echo "========================================"

          grep 'CONFIG_PACKAGE_luci-i18n-.*-zh-cn' .config || true

          echo "========================================"
          echo "Required Chinese Packages"
          echo "========================================"

          REQUIRED_PACKAGES="
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn
          "

          for pkg in $REQUIRED_PACKAGES; do
            if ! grep -q "^${pkg}=y$" .config; then
              echo "ERROR: Missing ${pkg}"
              exit 1
            fi
          done

          echo "All required Chinese packages are enabled."

          echo "========================================"
          echo "iStore"
          echo "========================================"

          if grep -q '^CONFIG_PACKAGE_luci-app-store=y$' .config; then
            echo "iStore CONFIG enabled."
          else
            echo "ERROR: luci-app-store was removed by make defconfig."
            exit 1
          fi

          echo "========================================"
          echo "Passwall"
          echo "========================================"

          grep -E 'passwall|xray-core|sing-box|geoview|chinadns' .config || true

          echo "========================================"
          echo "Lucky"
          echo "========================================"

          grep -E 'lucky' .config || true

          echo "========================================"
          echo "Root shadow"
          echo "========================================"

          test -f files/etc/shadow
          grep '^root:' files/etc/shadow | sed 's/:.*:/:***:/'


      # =====================================================
      # 下载源码
      # =====================================================

      - name: Download Sources
        working-directory: openwrt
        run: |
          set -e

          make download -j$(nproc) V=s


      # =====================================================
      # 编译
      # =====================================================

      - name: Compile Firmware
        id: compile
        working-directory: openwrt
        run: |
          set -e

          make -j$(nproc) V=s BUILD_LOG=1


      # =====================================================
      # 单线程重试
      # =====================================================

      - name: Retry Compile
        if: failure() && steps.compile.outcome == 'failure'
        working-directory: openwrt
        run: |
          set -e

          echo "Parallel compilation failed."
          echo "Retrying with single thread..."

          make -j1 V=s


      # =====================================================
      # 查找固件
      # =====================================================

      - name: Find Firmware
        working-directory: openwrt
        run: |
          set -e

          TARGET_DIR="bin/targets/airoha/${TARGET_SUBTARGET}"

          test -d "${TARGET_DIR}"

          echo "========================================"
          echo "Firmware files"
          echo "========================================"

          find "${TARGET_DIR}" -type f | sort


      # =====================================================
      # 准备 Release 文件
      # =====================================================

      - name: Prepare Release Files
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          TARGET_DIR="bin/targets/airoha/${TARGET_SUBTARGET}"
          RELEASE_DIR="${GITHUB_WORKSPACE}/release/${DEVICE_ID}"

          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"

          case "${DEVICE_ID}" in

            mf-ubi|md-ubi)

              find "${TARGET_DIR}" \
                -type f \
                -name '*sysupgrade.itb' \
                -exec cp {} "${RELEASE_DIR}/" \;

              find "${TARGET_DIR}" \
                -type f \
                -name '*recovery.itb' \
                -exec cp {} "${RELEASE_DIR}/" \;

              find "${TARGET_DIR}" \
                -type f \
                \( \
                  -name '*preloader.bin' \
                  -o -name '*bl31-uboot.fip' \
                  -o -name '*chainload-uboot.itb' \
                \) \
                -exec cp {} "${RELEASE_DIR}/" \;

              ;;

            mf|md)

              find "${TARGET_DIR}" \
                -type f \
                -name '*sysupgrade.bin' \
                -exec cp {} "${RELEASE_DIR}/" \;

              find "${TARGET_DIR}" \
                -type f \
                \( \
                  -name '*factory-kernel.bin' \
                  -o -name '*factory-rootfs.bin' \
                \) \
                -exec cp {} "${RELEASE_DIR}/" \;

              ;;

            *)
              echo "ERROR: Unknown device"
              exit 1
              ;;
          esac

          FILE_COUNT=$(find "${RELEASE_DIR}" -maxdepth 1 -type f | wc -l)

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: No firmware files were found."

            find "${TARGET_DIR}" -type f | sort

            exit 1
          fi

          cd "${RELEASE_DIR}"

          # BUILD_INFO.txt 会在下一步生成，因此 sha256sums.txt
          # 统一在 Publish GitHub Release 步骤中生成，确保校验文件
          # 覆盖所有最终发布的固件资产。
          rm -f sha256sums.txt

          ls -lh


      # =====================================================
      # Build Info
      # =====================================================

      - name: Create Build Info
        shell: bash
        run: |
          set -e

          RELEASE_DIR="${GITHUB_WORKSPACE}/release/${DEVICE_ID}"

          {
            echo "Nokia XG-040G ImmortalWrt Build"
            echo "========================================"
            echo ""
            echo "Device:"
            echo "${DEVICE_DESCRIPTION}"
            echo ""
            echo "Device ID:"
            echo "${DEVICE_ID}"
            echo ""
            echo "Target:"
            echo "airoha"
            echo ""
            echo "Subtarget:"
            echo "${TARGET_SUBTARGET}"
            echo ""
            echo "Profile:"
            echo "${TARGET_PROFILE}"
            echo ""
            echo "Source:"
            echo "https://github.com/immortalwrt/immortalwrt"
            echo ""
            echo "Build repository branch:"
            echo "${BUILD_BRANCH}"
            echo "Build repository commit:"
            echo "${BUILD_COMMIT}"
            echo ""
            echo "Build time:"
            date '+%Y-%m-%d %H:%M:%S %Z'
            echo ""
            echo "========================================"
            echo "Network"
            echo "========================================"
            echo ""
            echo "LAN IP: 192.168.6.1"
            echo "WAN: LAN1"
            echo "LAN: LAN2 + LAN3 + LAN4"
            echo "Hostname: OpenWrt"
            echo ""
            echo "========================================"
            echo "LuCI"
            echo "========================================"
            echo ""
            echo "Language: zh_cn (中文)"
            echo "Theme: Argon"
            echo ""
            echo "========================================"
            echo "Plugins"
            echo "========================================"
            echo ""
            echo "- Passwall (官方) + 中文"
            echo "- Lucky + 中文"
            echo "- iStore 商店"
            echo "- OpenClash"
            echo "- Argon 主题"
            echo ""
            echo "========================================"
            echo "Login"
            echo "========================================"
            echo ""
            echo "Username: root"
            echo "Password: password"
          } > "${RELEASE_DIR}/BUILD_INFO.txt"


      # =====================================================
      # 发布 GitHub Release
      # =====================================================

      - name: Publish GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          RELEASE_DIR="${GITHUB_WORKSPACE}/release/${DEVICE_ID}"

          test -d "${RELEASE_DIR}"
          test -f "${RELEASE_DIR}/BUILD_INFO.txt"

          # 对最终 Release 目录中的全部文件生成 SHA256。
          # 排除旧的 sha256sums.txt，避免把校验文件自身写进去。
          cd "${RELEASE_DIR}"
          rm -f sha256sums.txt
          sha256sum * > sha256sums.txt
          cd "${GITHUB_WORKSPACE}"

          test -f "${RELEASE_DIR}/sha256sums.txt"

          # 使用 run_id + run_attempt，确保重新运行同一个 workflow 时
          # 也不会因为 tag 已存在而失败。
          TAG="xg040g-${DEVICE_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_NAME="Nokia XG-040G-${DEVICE_NAME} ImmortalWrt Build ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          echo "========================================"
          echo "Creating GitHub Release"
          echo "========================================"
          echo "Tag: ${TAG}"
          echo "Name: ${RELEASE_NAME}"
          echo "Files:"
          find "${RELEASE_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort

          # gh 已预装在 GitHub-hosted runner。
          # 使用 GITHUB_TOKEN 创建 Release 并上传 release 目录中的全部文件。
          gh release create "${TAG}" \
            "${RELEASE_DIR}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_NAME}" \
            --notes-file "${RELEASE_DIR}/BUILD_INFO.txt" \
            --target "${BUILD_COMMIT}"

          echo "========================================"
          echo "GitHub Release created"
          echo "========================================"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}"


      # =====================================================
      # 上传固件
      # =====================================================

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-ImmortalWrt
          path: release/${{ env.DEVICE_ID }}/
          retention-days: 30


      # =====================================================
      # 上传完整 Target
      # =====================================================

      - name: Upload Full Target Directory
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-Full-Target
          path: openwrt/bin/targets/airoha/${{ env.TARGET_SUBTARGET }}/
          retention-days: 7


      # =====================================================
      # 上传编译日志
      # =====================================================

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-Build-Logs
          path: |
            openwrt/logs/
            openwrt/tmp/
          retention-days: 7