name: Build Nokia XG-040G MF/MD - ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "选择要编译的 Nokia XG-040G 型号"
        required: true
        type: choice
        default: mf-ubi
        options:
          - mf-ubi
          - mf
          - md
          - md-ubi
  schedule:
    - cron: "0 19 * * 6"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: ${{ github.event.inputs.device || 'mf-ubi' }} - ImmortalWrt
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Device Variables
        shell: bash
        run: |
          set -e
          DEVICE="${{ github.event.inputs.device || 'mf-ubi' }}"
          case "$DEVICE" in
            mf-ubi)
              echo "DEVICE_ID=mf-ubi" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MF-UBI" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MF UBI" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7583" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-mf-ubi" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi" >> "$GITHUB_ENV"
              ;;
            mf)
              echo "DEVICE_ID=mf" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MF" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MF" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7583" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-mf" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf" >> "$GITHUB_ENV"
              ;;
            md)
              echo "DEVICE_ID=md" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MD" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MD" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7581" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-md" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md" >> "$GITHUB_ENV"
              ;;
            md-ubi)
              echo "DEVICE_ID=md-ubi" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MD-UBI" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MD UBI" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7581" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-md-ubi" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown device: $DEVICE"
              exit 1
              ;;
          esac

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev file wget curl jq xsltproc swig time \
            libelf-dev device-tree-compiler

      - name: Clone ImmortalWrt
        run: |
          set -e
          rm -rf openwrt
          git clone --depth=1 --branch master \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git log -1 --oneline
          test -f Makefile

      - name: Add Feeds (Passwall + iStore)
        working-directory: openwrt
        run: |
          set -e
          # 官方 Passwall 源（放最前面优先）
          sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
          sed -i '1i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default
          # iStore
          echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default

      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install Passwall (clean conflict packages)
        working-directory: openwrt
        run: |
          set -e
          # 清理可能冲突的旧包
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls} 2>/dev/null || true
          rm -rf feeds/luci/applications/luci-app-passwall 2>/dev/null || true

          ./scripts/feeds update passwall_packages passwall_luci
          ./scripts/feeds install -a -p passwall_packages
          ./scripts/feeds install -a -p passwall_luci

      - name: Install iStore Package
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update istore
          ./scripts/feeds install -d y -p istore luci-app-store

      - name: Add Lucky (with Chinese support)
        working-directory: openwrt
        run: |
          set -e
          rm -rf package/lucky
          git clone --depth=1 https://github.com/gdy666/luci-app-lucky.git package/lucky

      - name: Add OpenAppFilter
        working-directory: openwrt
        run: |
          set -e
          rm -rf package/OpenAppFilter
          git clone --depth=1 https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      - name: Add OpenClash
        working-directory: openwrt
        run: |
          set -e
          rm -rf package/luci-app-openclash /tmp/OpenClash
          git clone --depth=1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          test -d /tmp/OpenClash/luci-app-openclash
          cp -rf /tmp/OpenClash/luci-app-openclash package/luci-app-openclash
          rm -rf /tmp/OpenClash

      - name: Add Argon Theme
        working-directory: openwrt
        run: |
          set -e
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

      - name: Verify Nokia Device Profile
        working-directory: openwrt
        run: |
          set -e
          echo "Device: ${DEVICE_DESCRIPTION}"
          echo "Target: ${TARGET_SUBTARGET}"
          echo "Profile: ${TARGET_PROFILE}"
          if ! grep -R -q "${TARGET_PROFILE}" target/linux/airoha 2>/dev/null; then
            echo "ERROR: Profile not found: ${TARGET_PROFILE}"
            exit 1
          fi

      - name: Generate Device Config
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          printf '%s\n' \
            'CONFIG_TARGET_airoha=y' \
            'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
            '' \
            '# ===== LuCI 基础 + 中文 =====' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_luci-ssl=y' \
            'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y' \
            '' \
            '# ===== 主题 =====' \
            'CONFIG_PACKAGE_luci-theme-argon=y' \
            'CONFIG_PACKAGE_luci-app-argon-config=y' \
            '' \
            '# ===== iStore 商店 =====' \
            'CONFIG_PACKAGE_luci-app-store=y' \
            '' \
            '# ===== Passwall 官方 =====' \
            'CONFIG_PACKAGE_luci-app-passwall=y' \
            'CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y' \
            'CONFIG_PACKAGE_xray-core=y' \
            'CONFIG_PACKAGE_sing-box=y' \
            'CONFIG_PACKAGE_geoview=y' \
            'CONFIG_PACKAGE_chinadns-ng=y' \
            '' \
            '# ===== Lucky + 中文 =====' \
            'CONFIG_PACKAGE_luci-app-lucky=y' \
            'CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y' \
            'CONFIG_PACKAGE_lucky=y' \
            '' \
            '# ===== OpenClash =====' \
            'CONFIG_PACKAGE_luci-app-openclash=y' \
            '' \
            '# ===== 其他常用 =====' \
            'CONFIG_PACKAGE_tailscale=y' \
            'CONFIG_PACKAGE_luci-app-oaf=y' \
            'CONFIG_PACKAGE_appfilter=y' \
            'CONFIG_PACKAGE_kmod-oaf=y' \
            'CONFIG_PACKAGE_kmod-tun=y' \
            'CONFIG_PACKAGE_kmod-nft-tproxy=y' \
            'CONFIG_PACKAGE_kmod-nft-socket=y' \
            'CONFIG_PACKAGE_dnsmasq-full=y' \
            'CONFIG_PACKAGE_kmod-usb-core=y' \
            'CONFIG_PACKAGE_kmod-usb2=y' \
            'CONFIG_PACKAGE_kmod-usb3=y' \
            'CONFIG_PACKAGE_usbutils=y' \
            'CONFIG_PACKAGE_block-mount=y' \
            'CONFIG_PACKAGE_kmod-fs-ext4=y' \
            'CONFIG_PACKAGE_kmod-fs-vfat=y' \
            'CONFIG_PACKAGE_kmod-fs-ntfs3=y' \
            'CONFIG_PACKAGE_ca-bundle=y' \
            'CONFIG_PACKAGE_curl=y' \
            'CONFIG_PACKAGE_wget-ssl=y' \
            'CONFIG_PACKAGE_ip-full=y' \
            'CONFIG_PACKAGE_tcpdump=y' \
            'CONFIG_PACKAGE_mtr=y' \
            'CONFIG_PACKAGE_htop=y' \
            'CONFIG_PACKAGE_openssl-util=y' \
            > .config

          case "${DEVICE_ID}" in
            mf-ubi)
              echo 'CONFIG_TARGET_airoha_an7583=y' >> .config
              echo 'CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y' >> .config
              ;;
            mf)
              echo 'CONFIG_TARGET_airoha_an7583=y' >> .config
              echo 'CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf=y' >> .config
              ;;
            md)
              echo 'CONFIG_TARGET_airoha_an7581=y' >> .config
              echo 'CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y' >> .config
              ;;
            md-ubi)
              echo 'CONFIG_TARGET_airoha_an7581=y' >> .config
              echo 'CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' >> .config
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Add Default Network Config
        working-directory: openwrt
        run: |
          set -e
          mkdir -p files/etc/uci-defaults

          printf '%s\n' \
            '#!/bin/sh' \
            "uci set network.lan.ipaddr='192.168.6.1'" \
            "uci set network.lan.netmask='255.255.255.0'" \
            "uci -q delete network.wan" \
            "uci set network.wan='interface'" \
            "uci set network.wan.device='lan1'" \
            "uci set network.wan.proto='dhcp'" \
            "uci -q delete network.br_lan" \
            "uci set network.br_lan='device'" \
            "uci set network.br_lan.name='br-lan'" \
            "uci set network.br_lan.type='bridge'" \
            "uci add_list network.br_lan.ports='lan2'" \
            "uci add_list network.br_lan.ports='lan3'" \
            "uci add_list network.br_lan.ports='lan4'" \
            "uci set network.lan.device='br-lan'" \
            "uci set dhcp.lan.start='100'" \
            "uci set dhcp.lan.limit='150'" \
            "uci set dhcp.lan.leasetime='12h'" \
            "uci set system.@system[0].hostname='OpenWrt'" \
            "uci set luci.main.lang='zh_cn'" \
            "uci set luci.main.mediaurlbase='/luci-static/argon'" \
            "echo 'root:password' | chpasswd" \
            "uci commit system" \
            "uci commit network" \
            "uci commit dhcp" \
            "uci commit luci" \
            'exit 0' \
            > files/etc/uci-defaults/99-xg040g-defaults

          chmod +x files/etc/uci-defaults/99-xg040g-defaults

      - name: Set Argon Default Theme
        working-directory: openwrt
        run: |
          set -e
          mkdir -p files/etc/uci-defaults

          printf '%s\n' \
            '#!/bin/sh' \
            'if [ -f /etc/config/luci ]; then' \
            "    uci set luci.main.mediaurlbase='/luci-static/argon'" \
            "    uci set luci.main.lang='zh_cn'" \
            '    uci commit luci' \
            'fi' \
            'exit 0' \
            > files/etc/uci-defaults/98-argon-default-theme

          chmod +x files/etc/uci-defaults/98-argon-default-theme

      - name: Make Defconfig
        working-directory: openwrt
        run: |
          set -e
          make defconfig

      - name: Show Final Config
        working-directory: openwrt
        run: |
          set -e
          echo "Device: ${DEVICE_DESCRIPTION}"
          echo "Target: ${TARGET_SUBTARGET}"
          echo "Profile: ${TARGET_PROFILE}"
          echo "========================================"
          grep '^CONFIG_TARGET_' .config || true
          echo "========================================"
          grep "${TARGET_CONFIG}" .config || true
          echo "========================================"
          echo "Chinese packages:"
          grep 'CONFIG_PACKAGE_luci-i18n-.*-zh-cn' .config || true
          echo "========================================"
          echo "Passwall / Lucky / iStore:"
          grep -E 'passwall|lucky|store' .config || true

      - name: Download Sources
        working-directory: openwrt
        run: |
          set -e
          make download -j$(nproc) V=s

      - name: Compile Firmware
        id: compile
        working-directory: openwrt
        run: |
          set -e
          make -j$(nproc) V=s BUILD_LOG=1

      - name: Retry Compile
        if: failure() && steps.compile.outcome == 'failure'
        working-directory: openwrt
        run: |
          echo "Parallel compilation failed. Retrying with single thread..."
          make -j1 V=s

      - name: Find Firmware
        working-directory: openwrt
        run: |
          set -e
          TARGET_DIR="bin/targets/airoha/${TARGET_SUBTARGET}"
          test -d "${TARGET_DIR}"
          echo "========================================"
          find "${TARGET_DIR}" -type f | sort

      - name: Prepare Release Files
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          TARGET_DIR="bin/targets/airoha/${TARGET_SUBTARGET}"
          RELEASE_DIR="${GITHUB_WORKSPACE}/release/${DEVICE_ID}"

          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"

          case "${DEVICE_ID}" in
            mf-ubi|md-ubi)
              find "${TARGET_DIR}" -type f -name '*sysupgrade.itb' -exec cp {} "${RELEASE_DIR}/" \;
              find "${TARGET_DIR}" -type f -name '*recovery.itb' -exec cp {} "${RELEASE_DIR}/" \;
              find "${TARGET_DIR}" -type f \( \
                -name '*preloader.bin' \
                -o -name '*bl31-uboot.fip' \
                -o -name '*chainload-uboot.itb' \
              \) -exec cp {} "${RELEASE_DIR}/" \;
              ;;
            mf|md)
              find "${TARGET_DIR}" -type f -name '*sysupgrade.bin' -exec cp {} "${RELEASE_DIR}/" \;
              find "${TARGET_DIR}" -type f \( \
                -name '*factory-kernel.bin' \
                -o -name '*factory-rootfs.bin' \
              \) -exec cp {} "${RELEASE_DIR}/" \;
              ;;
            *)
              exit 1
              ;;
          esac

          FILE_COUNT=$(find "${RELEASE_DIR}" -maxdepth 1 -type f | wc -l)
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: No firmware files were found."
            find "${TARGET_DIR}" -type f | sort
            exit 1
          fi

          cd "${RELEASE_DIR}"
          sha256sum * > sha256sums.txt
          ls -lh
          cat sha256sums.txt

      - name: Create Build Info
        shell: bash
        run: |
          set -e
          RELEASE_DIR="${GITHUB_WORKSPACE}/release/${DEVICE_ID}"

          {
            echo "Nokia XG-040G ImmortalWrt Build"
            echo "========================================"
            echo ""
            echo "Device:"
            echo "${DEVICE_DESCRIPTION}"
            echo ""
            echo "Device ID:"
            echo "${DEVICE_ID}"
            echo ""
            echo "Target:"
            echo "airoha"
            echo ""
            echo "Subtarget:"
            echo "${TARGET_SUBTARGET}"
            echo ""
            echo "Profile:"
            echo "${TARGET_PROFILE}"
            echo ""
            echo "Source:"
            echo "https://github.com/immortalwrt/immortalwrt"
            echo ""
            echo "Branch:"
            echo "master"
            echo ""
            echo "Build time:"
            date '+%Y-%m-%d %H:%M:%S %Z'
            echo ""
            echo "========================================"
            echo "Network"
            echo "========================================"
            echo ""
            echo "LAN IP: 192.168.6.1"
            echo "WAN: LAN1"
            echo "LAN: LAN2 + LAN3 + LAN4"
            echo "Hostname: OpenWrt"
            echo ""
            echo "========================================"
            echo "LuCI"
            echo "========================================"
            echo ""
            echo "Language: zh_cn (中文)"
            echo "Theme: Argon"
            echo ""
            echo "========================================"
            echo "Plugins"
            echo "========================================"
            echo ""
            echo "- Passwall (官方) + 中文"
            echo "- Lucky + 中文"
            echo "- iStore 商店"
            echo "- OpenClash"
            echo "- Argon 主题"
            echo ""
            echo "========================================"
            echo "Login"
            echo "========================================"
            echo ""
            echo "Username: root"
            echo "Password: password"
          } > "${RELEASE_DIR}/BUILD_INFO.txt"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-ImmortalWrt
          path: release/${{ env.DEVICE_ID }}/
          retention-days: 30

      - name: Upload Full Target Directory
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-Full-Target
          path: openwrt/bin/targets/airoha/${{ env.TARGET_SUBTARGET }}/
          retention-days: 7

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-Build-Logs
          path: |
            openwrt/logs/
            openwrt/tmp/
          retention-days: 7
