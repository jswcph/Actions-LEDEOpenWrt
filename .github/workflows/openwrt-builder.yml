name: Build Nokia XG-040G UBI

on:
  workflow_dispatch:
    inputs:
      device:
        description: "选择要编译的 Nokia XG-040G 型号"
        required: true
        type: choice
        default: mf
        options:
          - mf
          - md

  push:
    branches:
      - new-lede

  schedule:
    # 每周日北京时间凌晨 3 点
    # UTC = 周六 19:00
    - cron: "0 19 * * 6"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:

  build:

    name: Build Nokia XG-040G

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 根据选择确定设备
      # ============================================================

      - name: Set Device Variables
        id: device
        run: |

          if [ "${{ github.event.inputs.device }}" = "md" ]; then

            echo "DEVICE_NAME=Nokia-XG-040G-MD" >> "$GITHUB_OUTPUT"
            echo "DEVICE_MODEL=MD" >> "$GITHUB_OUTPUT"

            echo "TARGET=airoha" >> "$GITHUB_OUTPUT"
            echo "SUBTARGET=an7581" >> "$GITHUB_OUTPUT"

            echo "DEVICE_PROFILE=nokia_xg-040g-md" >> "$GITHUB_OUTPUT"

            echo "UBI_IMAGE=nokia_xg-040g-md-ubi-squashfs-sysupgrade.itb" >> "$GITHUB_OUTPUT"
            echo "RECOVERY_IMAGE=nokia_xg-040g-md-ubi-initramfs-recovery.itb" >> "$GITHUB_OUTPUT"
            echo "PRELOADER_IMAGE=nokia_xg-040g-md-ubi-preloader.bin" >> "$GITHUB_OUTPUT"
            echo "FIP_IMAGE=nokia_xg-040g-md-ubi-bl31-uboot.fip" >> "$GITHUB_OUTPUT"

          else

            echo "DEVICE_NAME=Nokia-XG-040G-MF" >> "$GITHUB_OUTPUT"
            echo "DEVICE_MODEL=MF" >> "$GITHUB_OUTPUT"

            echo "TARGET=airoha" >> "$GITHUB_OUTPUT"
            echo "SUBTARGET=an7583" >> "$GITHUB_OUTPUT"

            echo "DEVICE_PROFILE=nokia_xg-040g-mf" >> "$GITHUB_OUTPUT"

            echo "UBI_IMAGE=nokia_xg-040g-mf-ubi-squashfs-sysupgrade.itb" >> "$GITHUB_OUTPUT"
            echo "RECOVERY_IMAGE=nokia_xg-040g-mf-ubi-initramfs-recovery.itb" >> "$GITHUB_OUTPUT"
            echo "PRELOADER_IMAGE=nokia_xg-040g-mf-ubi-preloader.bin" >> "$GITHUB_OUTPUT"
            echo "FIP_IMAGE=nokia_xg-040g-mf-ubi-bl31-uboot.fip" >> "$GITHUB_OUTPUT"

          fi


      # ============================================================
      # 3. 显示设备信息
      # ============================================================

      - name: Show Device
        run: |

          echo "========================================"
          echo "Selected Device"
          echo "========================================"

          echo "Device:"
          echo "${{ steps.device.outputs.DEVICE_NAME }}"

          echo "Model:"
          echo "${{ steps.device.outputs.DEVICE_MODEL }}"

          echo "Target:"
          echo "${{ steps.device.outputs.TARGET }}"

          echo "Subtarget:"
          echo "${{ steps.device.outputs.SUBTARGET }}"

          echo "Profile:"
          echo "${{ steps.device.outputs.DEVICE_PROFILE }}"

          echo "UBI Image:"
          echo "${{ steps.device.outputs.UBI_IMAGE }}"

          echo "========================================"


      # ============================================================
      # 4. 清理 GitHub Actions 磁盘
      # ============================================================

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      # ============================================================
      # 5. 安装编译依赖
      # ============================================================

      - name: Install Build Dependencies
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            swig \
            time


      # ============================================================
      # 6. Clone 最新 OpenWrt master
      # ============================================================

      - name: Clone OpenWrt
        run: |

          set -e

          rm -rf openwrt

          git clone \
            --depth=1 \
            --branch master \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          echo "OpenWrt commit:"
          git log -1 --oneline

          test -f Makefile


      # ============================================================
      # 7. 添加 PassWall
      # ============================================================

      - name: Add PassWall Feeds
        working-directory: openwrt
        run: |

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          EOF


      # ============================================================
      # 8. 添加 iStore
      #
      # 官方推荐方式：
      # src-git istore https://github.com/linkease/istore;main
      #
      # iStore 官方集成说明：
      # ./scripts/feeds update istore
      # ./scripts/feeds install -d y -p istore luci-app-store
      # ============================================================

      - name: Add iStore Feed
        working-directory: openwrt
        run: |

          set -e

          echo "Adding iStore feed..."

          cat >> feeds.conf.default <<'EOF'

          src-git istore https://github.com/linkease/istore;main

          EOF


      # ============================================================
      # 9. 更新 feeds
      # ============================================================

      - name: Update Feeds
        working-directory: openwrt
        run: |

          set -e

          ./scripts/feeds clean

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ============================================================
      # 10. 强制安装 iStore
      # ============================================================

      - name: Install iStore Package
        working-directory: openwrt
        run: |

          set -e

          echo "Installing iStore..."

          ./scripts/feeds update istore

          ./scripts/feeds install -d y -p istore luci-app-store

          echo "Checking iStore package..."

          find package/feeds/istore \
            -maxdepth 3 \
            -type f \
            -name Makefile \
            2>/dev/null || true


      # ============================================================
      # 11. Lucky
      # ============================================================

      - name: Add Lucky
        working-directory: openwrt
        run: |

          rm -rf package/lucky

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky


      # ============================================================
      # 12. OpenAppFilter
      # ============================================================

      - name: Add OpenAppFilter
        working-directory: openwrt
        run: |

          rm -rf package/OpenAppFilter

          git clone \
            --depth=1 \
            https://github.com/destan19/OpenAppFilter.git \
            package/OpenAppFilter


      # ============================================================
      # 13. OpenClash
      # ============================================================

      - name: Add OpenClash
        working-directory: openwrt
        run: |

          set -e

          rm -rf package/luci-app-openclash
          rm -rf /tmp/OpenClash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          test -d /tmp/OpenClash/luci-app-openclash

          cp -rf \
            /tmp/OpenClash/luci-app-openclash \
            package/luci-app-openclash

          rm -rf /tmp/OpenClash


      # ============================================================
      # 14. Argon
      # ============================================================

      - name: Add Argon
        working-directory: openwrt
        run: |

          set -e

          rm -rf package/luci-theme-argon
          rm -rf package/luci-app-argon-config

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config


      # ============================================================
      # 15. 生成 MF / MD 对应配置
      # ============================================================

      - name: Generate Device Config
        working-directory: openwrt
        run: |

          if [ "${{ steps.device.outputs.DEVICE_MODEL }}" = "MD" ]; then

            TARGET_CONFIG="
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y
          "

          else

            TARGET_CONFIG="
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7583=y
          CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf=y
          "

          fi


          cat > .config <<EOF

          #
          # ==========================================================
          # Nokia XG-040G
          # ==========================================================

          $TARGET_CONFIG


          #
          # ==========================================================
          # UBI / SquashFS
          # ==========================================================

          CONFIG_TARGET_ROOTFS_SQUASHFS=y


          #
          # ==========================================================
          # LuCI
          # ==========================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y


          #
          # ==========================================================
          # Argon
          # ==========================================================

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y


          #
          # ==========================================================
          # iStore
          # ==========================================================

          CONFIG_PACKAGE_luci-app-store=y


          #
          # ==========================================================
          # PassWall
          # ==========================================================

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_xray-core=y
          # PassWall on aarch64 enables Sing-Box by default; disable it to avoid the current
          # go-json-experiment/json dependency mismatch in OpenWrt packages master.
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n
          CONFIG_PACKAGE_sing-box=n

          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y


          #
          # ==========================================================
          # OpenClash
          # ==========================================================

          CONFIG_PACKAGE_luci-app-openclash=y


          #
          # ==========================================================
          # Lucky
          # ==========================================================

          CONFIG_PACKAGE_luci-app-lucky=y


          #
          # ==========================================================
          # File Manager
          # ==========================================================

          CONFIG_PACKAGE_luci-app-filemanager=y


          #
          # ==========================================================
          # OpenAppFilter
          # ==========================================================

          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_kmod-oaf=y


          #
          # ==========================================================
          # Proxy
          # ==========================================================

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y


          #
          # ==========================================================
          # DNS
          # ==========================================================

          CONFIG_PACKAGE_dnsmasq-full=y


          #
          # ==========================================================
          # Network tools
          # ==========================================================

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_mtr=y


          #
          # ==========================================================
          # SSL
          # ==========================================================

          CONFIG_PACKAGE_openssl-util=y

          EOF


      # ============================================================
      # 16. 检查设备 Profile
      # ============================================================

      - name: Verify Device Target
        working-directory: openwrt
        run: |

          set -e

          echo "========================================"
          echo "Checking device profile"
          echo "========================================"

          if [ "${{ steps.device.outputs.DEVICE_MODEL }}" = "MD" ]; then

            grep -R \
              "nokia_xg-040g-md" \
              target/linux/airoha \
              2>/dev/null || true

            grep \
              "CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md" \
              .config

          else

            grep -R \
              "nokia_xg-040g-mf" \
              target/linux/airoha \
              2>/dev/null || true

            grep \
              "CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf" \
              .config

          fi


      # ============================================================
      # 17. Make defconfig
      # ============================================================

      - name: Make Defconfig
        working-directory: openwrt
        run: |

          set -e

          make defconfig


      # ============================================================
      # 18. 输出最终配置
      # ============================================================

      - name: Show Final Config
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config || true

          echo "========================================"
          echo "PACKAGES"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(luci-app-passwall|xray-core|luci-app-openclash|luci-app-lucky|luci-app-filemanager|luci-app-oaf|appfilter|kmod-oaf|luci-theme-argon|luci-app-store)' \
            .config || true


      # ============================================================
      # 19. 默认系统配置
      # ============================================================

      - name: Add Default Settings
        working-directory: openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-xg040g-defaults <<'EOF'

          #!/bin/sh

          # ==================================================
          # Nokia XG-040G
          # Default Settings
          # ==================================================


          # ==================================================
          # Hostname
          # ==================================================

          uci set system.@system[0].hostname='OpenWrt'


          # ==================================================
          # LAN IP
          # ==================================================

          uci set network.lan.ipaddr='192.168.6.1'
          uci set network.lan.netmask='255.255.255.0'


          # ==================================================
          # WAN = LAN1
          # LAN = LAN2 + LAN3 + LAN4
          # ==================================================

          if ip link show lan1 >/dev/null 2>&1; then

              uci -q delete network.wan

              uci set network.wan='interface'
              uci set network.wan.device='lan1'
              uci set network.wan.proto='dhcp'

          fi


          if ip link show lan2 >/dev/null 2>&1; then

              uci -q delete network.br_lan

              uci set network.br_lan='device'
              uci set network.br_lan.name='br-lan'
              uci set network.br_lan.type='bridge'

              uci add_list network.br_lan.ports='lan2'
              uci add_list network.br_lan.ports='lan3'
              uci add_list network.br_lan.ports='lan4'

              uci set network.lan.device='br-lan'

          fi


          # ==================================================
          # Root password
          # ==================================================

          echo 'root:password' | chpasswd


          # ==================================================
          # Commit
          # ==================================================

          uci commit system
          uci commit network

          exit 0

          EOF

          chmod +x \
            files/etc/uci-defaults/99-xg040g-defaults


      # ============================================================
      # 20. 设置 Argon 默认主题
      # ============================================================

      - name: Set Argon Default
        working-directory: openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-argon-default <<'EOF'

          #!/bin/sh

          if [ -f /etc/config/luci ]; then

              uci set luci.main.mediaurlbase='/luci-static/argon'

              uci commit luci

          fi

          exit 0

          EOF

          chmod +x \
            files/etc/uci-defaults/98-argon-default


      # ============================================================
      # 21. 下载源码包
      # ============================================================

      - name: Download Sources
        working-directory: openwrt
        run: |

          set -e

          make download -j$(nproc) V=s


      # ============================================================
      # 22. 编译
      # ============================================================

      - name: Compile Firmware
        working-directory: openwrt
        run: |

          set -e

          make -j$(nproc) V=s BUILD_LOG=1


      # ============================================================
      # 23. 编译失败自动单线程重试
      # ============================================================

      - name: Retry Compile
        if: failure()
        working-directory: openwrt
        run: |

          set -e

          echo "Parallel compilation failed."

          echo "Retrying with single thread."

          make -j1 V=s


      # ============================================================
      # 24. 查找对应设备固件
      # ============================================================

      - name: Find Firmware
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "Generated firmware"
          echo "========================================"

          find \
            bin/targets/${{ steps.device.outputs.TARGET }}/${{ steps.device.outputs.SUBTARGET }} \
            -type f \
            -iname "*${{ steps.device.outputs.DEVICE_PROFILE }}*" \
            -print \
            | sort


      # ============================================================
      # 25. 强制检查 UBI ITB
      # ============================================================

      - name: Verify UBI Firmware
        working-directory: openwrt
        run: |

          set -e

          UBI_IMAGE="bin/targets/${{ steps.device.outputs.TARGET }}/${{ steps.device.outputs.SUBTARGET }}/${{ steps.device.outputs.UBI_IMAGE }}"

          echo "========================================"
          echo "Checking UBI firmware"
          echo "========================================"

          if [ ! -f "$UBI_IMAGE" ]; then

              echo ""
              echo "ERROR:"
              echo "UBI firmware was NOT generated."
              echo ""

              echo "Expected:"
              echo "$UBI_IMAGE"

              echo ""
              echo "Generated files:"

              find \
                bin/targets/${{ steps.device.outputs.TARGET }}/${{ steps.device.outputs.SUBTARGET }} \
                -type f \
                -iname "*${{ steps.device.outputs.DEVICE_PROFILE }}*" \
                -print \
                | sort

              exit 1

          fi


          echo ""
          echo "UBI firmware found:"
          ls -lh "$UBI_IMAGE"


          echo ""
          echo "File type:"
          file "$UBI_IMAGE"


          echo ""
          echo "SHA256:"
          sha256sum "$UBI_IMAGE"


      # ============================================================
      # 26. 准备 Release
      # ============================================================

      - name: Prepare Release
        working-directory: openwrt
        run: |

          set -e

          rm -rf /tmp/release

          mkdir -p /tmp/release

          BASE="bin/targets/${{ steps.device.outputs.TARGET }}/${{ steps.device.outputs.SUBTARGET }}"


          # ========================================================
          # UBI Sysupgrade ITB
          # ========================================================

          cp \
            "$BASE/${{ steps.device.outputs.UBI_IMAGE }}" \
            /tmp/release/


          # ========================================================
          # Recovery
          # ========================================================

          if [ -f "$BASE/${{ steps.device.outputs.RECOVERY_IMAGE }}" ]; then

              cp \
                "$BASE/${{ steps.device.outputs.RECOVERY_IMAGE }}" \
                /tmp/release/

          fi


          # ========================================================
          # Preloader
          # ========================================================

          if [ -f "$BASE/${{ steps.device.outputs.PRELOADER_IMAGE }}" ]; then

              cp \
                "$BASE/${{ steps.device.outputs.PRELOADER_IMAGE }}" \
                /tmp/release/

          fi


          # ========================================================
          # BL31 + U-Boot
          # ========================================================

          if [ -f "$BASE/${{ steps.device.outputs.FIP_IMAGE }}" ]; then

              cp \
                "$BASE/${{ steps.device.outputs.FIP_IMAGE }}" \
                /tmp/release/

          fi


          # ========================================================
          # SHA256
          # ========================================================

          cd /tmp/release

          sha256sum * > sha256sums.txt


          echo "========================================"
          echo "Release files"
          echo "========================================"

          ls -lh

          echo ""

          echo "SHA256:"

          cat sha256sums.txt


      # ============================================================
      # 27. Actions Artifact
      # ============================================================

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.device.outputs.DEVICE_NAME }}-UBI
          path: /tmp/release/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 28. 创建 Release Tag
      # ============================================================

      - name: Generate Release Tag
        id: release_tag
        run: |

          echo "tag=${{ steps.device.outputs.DEVICE_MODEL }}-v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 29. 自动发布 GitHub Release
      # ============================================================

      - name: Upload Firmware to GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.release_tag.outputs.tag }}

          name: ${{ steps.device.outputs.DEVICE_NAME }} UBI ${{ steps.release_tag.outputs.tag }}

          body: |
            # Nokia XG-040G UBI

            Device:
            `${{ steps.device.outputs.DEVICE_NAME }}`

            Target:
            `${{ steps.device.outputs.TARGET }}/${{ steps.device.outputs.SUBTARGET }}`

            Filesystem:
            `UBI / SPI-NAND`

            Default IP:
            `192.168.6.1`

            Username:
            `root`

            Password:
            `password`

            Hostname:
            `OpenWrt`

            Theme:
            `Argon`

            Network:
            - LAN1 = WAN
            - LAN2 = LAN
            - LAN3 = LAN
            - LAN4 = LAN

            Included:
            - PassWall
            - Xray
            - OpenClash
            - Lucky
            - File Manager
            - OpenAppFilter
            - iStore

            Source:
            Latest OpenWrt master

          files: |
            /tmp/release/${{ steps.device.outputs.UBI_IMAGE }}
            /tmp/release/${{ steps.device.outputs.RECOVERY_IMAGE }}
            /tmp/release/${{ steps.device.outputs.PRELOADER_IMAGE }}
            /tmp/release/${{ steps.device.outputs.FIP_IMAGE }}
            /tmp/release/sha256sums.txt

          draft: false
          prerelease: false
          generate_release_notes: true
