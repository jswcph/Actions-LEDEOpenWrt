name: Build Nokia XG-040G MF/MD - ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "选择要编译的 Nokia XG-040G 型号"
        required: true
        type: choice
        default: mf-ubi
        options:
          - mf-ubi
          - mf
          - md
          - md-ubi

  schedule:
    # 每周日北京时间凌晨 3 点
    # GitHub Actions 使用 UTC
    - cron: "0 19 * * 6"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:

  build:
    name: ${{ github.event.inputs.device || 'mf-ubi' }} - ImmortalWrt
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Device Variables
        shell: bash
        run: |
          set -e

          DEVICE="${{ github.event.inputs.device || 'mf-ubi' }}"

          case "${DEVICE}" in
            mf-ubi)
              echo "DEVICE_ID=mf-ubi" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MF-UBI" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MF UBI" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7583" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-mf-ubi" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi" >> "$GITHUB_ENV"
              ;;
            mf)
              echo "DEVICE_ID=mf" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MF" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MF" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7583" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-mf" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf" >> "$GITHUB_ENV"
              ;;
            md)
              echo "DEVICE_ID=md" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MD" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MD" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7581" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-md" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md" >> "$GITHUB_ENV"
              ;;
            md-ubi)
              echo "DEVICE_ID=md-ubi" >> "$GITHUB_ENV"
              echo "DEVICE_NAME=MD-UBI" >> "$GITHUB_ENV"
              echo "DEVICE_DESCRIPTION=Nokia XG-040G-MD UBI" >> "$GITHUB_ENV"
              echo "TARGET_SUBTARGET=an7581" >> "$GITHUB_ENV"
              echo "TARGET_PROFILE=nokia_xg-040g-md-ubi" >> "$GITHUB_ENV"
              echo "TARGET_CONFIG=CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi" >> "$GITHUB_ENV"
              ;;
            *)
              echo "ERROR: Unknown device ${DEVICE}"
              exit 1
              ;;
          esac

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            swig \
            time \
            libelf-dev \
            device-tree-compiler

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf openwrt

          git clone \
            --depth=1 \
            --branch master \
            https://github.com/immortalwrt/immortalwrt.git \
            openwrt

          cd openwrt
          git log -1 --oneline
          test -f Makefile

      - name: Add iStore Feed
        working-directory: openwrt
        run: |
          set -e

          if ! grep -q "src-git istore" feeds.conf.default; then
            cat >> feeds.conf.default <<'EOF'

src-git istore https://github.com/linkease/istore.git;main

EOF
          fi

      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install iStore Package
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update istore
          ./scripts/feeds install -d y -p istore luci-app-store

      - name: Add Lucky
        working-directory: openwrt
        run: |
          set -e
          rm -rf package/lucky
          git clone --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

      - name: Add OpenAppFilter
        working-directory: openwrt
        run: |
          set -e
          rm -rf package/OpenAppFilter
          git clone --depth=1 \
            https://github.com/destan19/OpenAppFilter.git \
            package/OpenAppFilter

      - name: Add OpenClash
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-app-openclash
          rm -rf /tmp/OpenClash

          git clone --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          test -d /tmp/OpenClash/luci-app-openclash

          cp -rf \
            /tmp/OpenClash/luci-app-openclash \
            package/luci-app-openclash

          rm -rf /tmp/OpenClash

      - name: Add Argon Theme
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-theme-argon
          rm -rf package/luci-app-argon-config

          git clone --depth=1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone --depth=1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

      - name: Verify Nokia Device Profile
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "Device: ${DEVICE_DESCRIPTION}"
          echo "Target: ${TARGET_SUBTARGET}"
          echo "Profile: ${TARGET_PROFILE}"

          if ! grep -R -q "${TARGET_PROFILE}" target/linux/airoha 2>/dev/null; then
            echo "ERROR: The selected Nokia profile does not exist:"
            echo "${TARGET_PROFILE}"
            exit 1
          fi

          echo "Profile found successfully."

      - name: Generate Device Config
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          rm -f .config

          cat > .config <<'EOF'
CONFIG_TARGET_airoha=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y

CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y

CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-argon-config=y

CONFIG_PACKAGE_luci-app-store=y

CONFIG_PACKAGE_luci-app-openclash=y

CONFIG_PACKAGE_luci-app-lucky=y

CONFIG_PACKAGE_tailscale=y

CONFIG_PACKAGE_luci-app-oaf=y
CONFIG_PACKAGE_appfilter=y
CONFIG_PACKAGE_kmod-oaf=y

CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_kmod-nft-tproxy=y
CONFIG_PACKAGE_kmod-nft-socket=y

CONFIG_PACKAGE_dnsmasq-full=y

CONFIG_PACKAGE_kmod-usb-core=y
CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_usbutils=y

CONFIG_PACKAGE_block-mount=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-fs-ntfs3=y

CONFIG_PACKAGE_ca-bundle=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget-ssl=y
CONFIG_PACKAGE_ip-full=y
CONFIG_PACKAGE_tcpdump=y
CONFIG_PACKAGE_mtr=y
CONFIG_PACKAGE_htop=y

CONFIG_PACKAGE_openssl-util=y
EOF

          case "${DEVICE_ID}" in
            mf-ubi)
              cat >> .config <<'EOF'

CONFIG_TARGET_airoha_an7583=y
CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y
EOF
              ;;
            mf)
              cat >> .config <<'EOF'

CONFIG_TARGET_airoha_an7583=y
CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf=y
EOF
              ;;
            md)
              cat >> .config <<'EOF'

CONFIG_TARGET_airoha_an7581=y
CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y
EOF
              ;;
            md-ubi)
              cat >> .config <<'EOF'

CONFIG_TARGET_airoha_an7581=y
CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
EOF
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Add Default Network Config
        working-directory: openwrt
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-xg040g-defaults <<'EOF'
#!/bin/sh

uci set network.lan.ipaddr='192.168.6.1'
uci set network.lan.netmask='255.255.255.0'

uci -q delete network.wan
uci set network.wan='interface'
uci set network.wan.device='lan1'
uci set network.wan.proto='dhcp'

uci -q delete network.br_lan
uci set network.br_lan='device'
uci set network.br_lan.name='br-lan'
uci set network.br_lan.type='bridge'

uci add_list network.br_lan.ports='lan2'
uci add_list network.br_lan.ports='lan3'
uci add_list network.br_lan.ports='lan4'

uci set network.lan.device='br-lan'

uci set dhcp.lan.start='100'
uci set dhcp.lan.limit='150'
uci set dhcp.lan.leasetime='12h'

uci set system.@system[0].hostname='OpenWrt'

uci set luci.main.lang='zh_cn'
uci set luci.main.mediaurlbase='/luci-static/argon'

echo 'root:password' | chpasswd

uci commit system
uci commit network
uci commit dhcp
uci commit luci

exit 0
EOF

          chmod +x files/etc/uci-defaults/99-xg040g-defaults

      - name: Set Argon Default Theme
        working-directory: openwrt
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-argon-default-theme <<'EOF'
#!/bin/sh

if [ -f /etc/config/luci ]; then
    uci set luci.main.mediaurlbase='/luci-static/argon'
    uci set luci.main.lang='zh_cn'
    uci commit luci
fi

exit 0
EOF

          chmod +x files/etc/uci-defaults/98-argon-default-theme

      - name: Make Defconfig
        working-directory: openwrt
        run: |
          set -e
          make defconfig

      - name: Show Final Config
        working-directory: openwrt
        run: |
          set -e

          echo "========================================"
          echo "DEVICE"
          echo "${DEVICE_DESCRIPTION}"
          echo "========================================"

          echo ""
          echo "TARGET CONFIG"
          grep '^CONFIG_TARGET_' .config || true

          echo ""
          echo "SELECTED PROFILE"
          grep "${TARGET_CONFIG}" .config || true

          echo ""
          echo "CHINESE LUCI"
          grep 'CONFIG_PACKAGE_luci-i18n-.*-zh-cn' .config || true

          echo ""
          echo "PACKAGES"
          grep -E \
            'CONFIG_PACKAGE_(luci-app-store|luci-app-openclash|luci-app-lucky|tailscale|luci-app-oaf|appfilter|kmod-oaf)' \
            .config || true

      - name: Download Sources
        working-directory: openwrt
        run: |
          set -e
          make download -j$(nproc) V=s

      - name: Compile Firmware
        id: compile
        working-directory: openwrt
        run: |
          set -e
          make -j$(nproc) V=s BUILD_LOG=1

      - name: Retry Compile
        if: failure() && steps.compile.outcome == 'failure'
        working-directory: openwrt
        run: |
          echo "Parallel compilation failed. Retrying with single thread..."
          make -j1 V=s

      - name: Find Firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          TARGET_DIR="bin/targets/airoha/${TARGET_SUBTARGET}"

          test -d "${TARGET_DIR}"

          echo "========================================"
          echo "ALL FIRMWARE"
          echo "========================================"

          find "${TARGET_DIR}" -type f | sort

          echo ""
          echo "========================================"
          echo "NOKIA FIRMWARE"
          echo "========================================"

          find "${TARGET_DIR}" \
            -type f \
            \( \
              -iname '*xg-040g*' \
              -o -iname '*sysupgrade*' \
              -o -iname '*factory*' \
              -o -iname '*recovery.itb' \
              -o -iname '*preloader.bin' \
              -o -iname '*bl31-uboot.fip' \
            \) \
            | sort

      - name: Prepare Release Files
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          TARGET_DIR="bin/targets/airoha/${TARGET_SUBTARGET}"
          RELEASE_DIR="${GITHUB_WORKSPACE}/release/${DEVICE_ID}"

          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"

          case "${DEVICE_ID}" in
            mf-ubi|md-ubi)
              find "${TARGET_DIR}" \
                -type f \
                -name '*sysupgrade.itb' \
                -exec cp {} "${RELEASE_DIR}/" \;

              find "${TARGET_DIR}" \
                -type f \
                -name '*recovery.itb' \
                -exec cp {} "${RELEASE_DIR}/" \;

              find "${TARGET_DIR}" \
                -type f \
                \( \
                  -name '*preloader.bin' \
                  -o -name '*bl31-uboot.fip' \
                  -o -name '*chainload-uboot.itb' \
                \) \
                -exec cp {} "${RELEASE_DIR}/" \;
              ;;
            mf|md)
              find "${TARGET_DIR}" \
                -type f \
                -name '*sysupgrade.bin' \
                -exec cp {} "${RELEASE_DIR}/" \;

              find "${TARGET_DIR}" \
                -type f \
                \( \
                  -name '*factory-kernel.bin' \
                  -o -name '*factory-rootfs.bin' \
                \) \
                -exec cp {} "${RELEASE_DIR}/" \;
              ;;
            *)
              exit 1
              ;;
          esac

          FILE_COUNT=$(find "${RELEASE_DIR}" -maxdepth 1 -type f | wc -l)

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: No firmware files were found."
            find "${TARGET_DIR}" -type f | sort
            exit 1
          fi

          cd "${RELEASE_DIR}"
          sha256sum * > sha256sums.txt

          ls -lh
          cat sha256sums.txt

      - name: Create Build Info
        shell: bash
        run: |
          set -e

          RELEASE_DIR="${GITHUB_WORKSPACE}/release/${DEVICE_ID}"

          cat > "${RELEASE_DIR}/BUILD_INFO.txt" <<EOF
Nokia XG-040G ImmortalWrt Build
========================================

Device:
${DEVICE_DESCRIPTION}

Device ID:
${DEVICE_ID}

Target:
airoha

Subtarget:
${TARGET_SUBTARGET}

Profile:
${TARGET_PROFILE}

Source:
https://github.com/immortalwrt/immortalwrt

Branch:
master

Build time:
$(date '+%Y-%m-%d %H:%M:%S %Z')

========================================
Network
========================================

LAN IP:
192.168.6.1

WAN:
LAN1

LAN:
LAN2 + LAN3 + LAN4

Hostname:
OpenWrt

========================================
LuCI
========================================

Language:
zh_cn

Theme:
Argon

========================================
Login
========================================

Username:
root

Password:
password
EOF

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-ImmortalWrt
          path: release/${{ env.DEVICE_ID }}/
          retention-days: 30

      - name: Upload Full Target Directory
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-Full-Target
          path: openwrt/bin/targets/airoha/${{ env.TARGET_SUBTARGET }}/
          retention-days: 7

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-${{ env.DEVICE_NAME }}-Build-Logs
          path: |
            openwrt/logs/
            openwrt/tmp/
          retention-days: 7
