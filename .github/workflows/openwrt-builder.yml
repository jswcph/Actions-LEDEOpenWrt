name: Build Nokia XG-040G-MF

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    # 每周日北京时间凌晨 3 点自动编译
    # UTC 19:00 = 北京时间次日 03:00
    - cron: "0 19 * * 6"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Nokia XG-040G-MF
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 检出自己的仓库
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 清理 GitHub Actions 磁盘空间
      # ============================================================
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ============================================================
      # 3. 安装编译环境
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            swig \
            time

      # ============================================================
      # 4. 获取 OpenWrt 官方最新源码
      #
      # Nokia XG-040G-MF
      # Airoha AN7583
      # ============================================================
      - name: Clone OpenWrt
        run: |
          set -e

          echo "========================================"
          echo "Current directory"
          echo "========================================"
          pwd

          echo "========================================"
          echo "Current files"
          echo "========================================"
          ls -la

          rm -rf openwrt

          git clone \
            --depth=1 \
            --branch master \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "========================================"
          echo "OpenWrt directory"
          echo "========================================"
          ls -la openwrt

          test -f openwrt/Makefile

          echo "OpenWrt clone completed successfully."

      # ============================================================
      # 5. 添加 PassWall feeds
      #
      # 使用 PassWall 官方当前 main 分支
      # ============================================================
      - name: Add PassWall Feeds
        working-directory: openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          EOF

          echo "========== PassWall Feeds =========="
          tail -10 feeds.conf.default

      # ============================================================
      # 6. 更新并安装 feeds
      # ============================================================
      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          set -e

          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 7. 添加 Lucky
      # ============================================================
      - name: Add Lucky
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/lucky

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

      # ============================================================
      # 8. 添加 OpenAppFilter
      # ============================================================
      - name: Add OpenAppFilter
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/OpenAppFilter

          git clone \
            --depth=1 \
            https://github.com/destan19/OpenAppFilter.git \
            package/OpenAppFilter

      # ============================================================
      # 9. 添加 OpenClash
      # ============================================================
      - name: Add OpenClash
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-app-openclash
          rm -rf /tmp/OpenClash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          cp -rf \
            /tmp/OpenClash/luci-app-openclash \
            package/luci-app-openclash

          rm -rf /tmp/OpenClash

      # ============================================================
      # 10. 添加 Argon
      # ============================================================
      - name: Add Argon Theme
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-theme-argon
          rm -rf package/luci-app-argon-config

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

      # ============================================================
      # 11. 检查插件是否成功加入
      # ============================================================
      - name: Verify Packages
        working-directory: openwrt
        run: |
          echo "========================================"
          echo "PassWall"
          echo "========================================"

          find package/feeds \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            -path '*passwall*' \
            2>/dev/null || true

          echo "========================================"
          echo "Lucky"
          echo "========================================"

          find package/lucky \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

          echo "========================================"
          echo "OpenClash"
          echo "========================================"

          find package/luci-app-openclash \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

          echo "========================================"
          echo "OpenAppFilter"
          echo "========================================"

          find package/OpenAppFilter \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

          echo "========================================"
          echo "Argon"
          echo "========================================"

          find package/luci-theme-argon \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

      # ============================================================
      # 12. 生成 Nokia XG-040G-MF 配置
      # ============================================================
      - name: Generate XG-040G-MF Config
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          #
          # ==========================================================
          # Nokia XG-040G-MF
          # Airoha AN7583
          # ==========================================================
          #

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7583=y
          CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf=y

          #
          # ==========================================================
          # Root filesystem
          # ==========================================================
          #

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          #
          # ==========================================================
          # LuCI
          # ==========================================================
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          #
          # ==========================================================
          # Argon
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          #
          # ==========================================================
          # PassWall
          #
          # PassWall 当前源码会自动选择 Xray / Sing-box
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y

          #
          # PassWall 常用依赖
          #

          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          #
          # ==========================================================
          # OpenClash
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-openclash=y

          #
          # ==========================================================
          # Lucky
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-lucky=y

          #
          # ==========================================================
          # File Manager
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-filemanager=y

          #
          # ==========================================================
          # OpenAppFilter
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_kmod-oaf=y

          #
          # ==========================================================
          # Network / proxy
          # ==========================================================
          #

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y

          #
          # ==========================================================
          # DNS
          # ==========================================================
          #

          CONFIG_PACKAGE_dnsmasq-full=y

          #
          # ==========================================================
          # Basic tools
          # ==========================================================
          #

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_mtr=y

          #
          # ==========================================================
          # SSL
          # ==========================================================
          #

          CONFIG_PACKAGE_openssl-util=y

          EOF

      # ============================================================
      # 13. 检查 Nokia XG-040G-MF Target
      # ============================================================
      - name: Verify XG-040G-MF Target
        working-directory: openwrt
        run: |
          set -e

          echo "========================================"
          echo "Checking Airoha target"
          echo "========================================"

          grep -R \
            "xg-040g-mf\|XG-040G-MF" \
            target/linux/airoha \
            2>/dev/null || true

          echo "========================================"
          echo "Checking target configuration"
          echo "========================================"

          grep \
            "CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf" \
            .config || true

          echo "========================================"
          echo "Available Airoha devices"
          echo "========================================"

          grep -R \
            "config TARGET_DEVICE" \
            target/linux/airoha \
            2>/dev/null | head -100 || true

      # ============================================================
      # 14. 设置默认网络
      #
      # LAN1 = WAN
      # LAN2 + LAN3 + LAN4 = LAN
      #
      # 默认地址：
      # 192.168.6.1
      #
      # 默认：
      # root / password
      #
      # 默认 hostname：
      # OpenWrt
      # ============================================================
      - name: Add Default Network Config
        working-directory: openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-xg040g-mf-defaults <<'EOF'
          #!/bin/sh

          # ==================================================
          # Nokia XG-040G-MF
          # Default configuration
          # ==================================================

          # --------------------------------------------------
          # LAN IP
          # --------------------------------------------------

          uci set network.lan.ipaddr='192.168.6.1'
          uci set network.lan.netmask='255.255.255.0'

          # --------------------------------------------------
          # WAN = LAN1
          # LAN = LAN2 + LAN3 + LAN4
          # --------------------------------------------------

          if ip link show lan1 >/dev/null 2>&1; then

              uci -q delete network.wan
              uci set network.wan='interface'
              uci set network.wan.device='lan1'
              uci set network.wan.proto='dhcp'

          fi

          if ip link show lan2 >/dev/null 2>&1; then
              uci -q delete network.br_lan
              uci set network.br_lan='device'
              uci set network.br_lan.name='br-lan'
              uci set network.br_lan.type='bridge'

              uci add_list network.br_lan.ports='lan2'
              uci add_list network.br_lan.ports='lan3'
              uci add_list network.br_lan.ports='lan4'

              uci set network.lan.device='br-lan'
          fi

          # --------------------------------------------------
          # Hostname
          # --------------------------------------------------

          uci set system.@system[0].hostname='OpenWrt'

          # --------------------------------------------------
          # Root password
          # --------------------------------------------------

          echo 'root:password' | chpasswd

          # --------------------------------------------------
          # Commit
          # --------------------------------------------------

          uci commit system
          uci commit network

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/99-xg040g-mf-defaults

      # ============================================================
      # 15. 设置 Argon 为默认主题
      # ============================================================
      - name: Set Argon Default Theme
        working-directory: openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-argon-default-theme <<'EOF'
          #!/bin/sh

          if [ -f /etc/config/luci ]; then
              uci set luci.main.mediaurlbase='/luci-static/argon'
              uci commit luci
          fi

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/98-argon-default-theme

      # ============================================================
      # 16. Make Defconfig
      # ============================================================
      - name: Make Defconfig
        working-directory: openwrt
        run: |
          make defconfig

      # ============================================================
      # 17. 显示最终配置
      # ============================================================
      - name: Show Final Config
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config || true

          echo "========================================"
          echo "PASSWALL / CORES"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box|geoview|v2ray-geoip|v2ray-geosite)' \
            .config || true

          echo "========================================"
          echo "OPENCLASH"
          echo "========================================"

          grep \
            'CONFIG_PACKAGE_luci-app-openclash' \
            .config || true

          echo "========================================"
          echo "LUCKY"
          echo "========================================"

          grep \
            'CONFIG_PACKAGE_luci-app-lucky' \
            .config || true

          echo "========================================"
          echo "ARGON"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_luci-(theme-argon|app-argon-config)' \
            .config || true

          echo "========================================"
          echo "OPENAPPFILTER"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(luci-app-oaf|appfilter|kmod-oaf)' \
            .config || true

          echo "========================================"
          echo "FILEMANAGER"
          echo "========================================"

          grep \
            'CONFIG_PACKAGE_luci-app-filemanager' \
            .config || true

      # ============================================================
      # 18. 下载源码包
      # ============================================================
      - name: Download Sources
        working-directory: openwrt
        run: |
          make download -j$(nproc) V=s

      # ============================================================
      # 19. 编译
      # ============================================================
      - name: Compile Firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s BUILD_LOG=1

      # ============================================================
      # 20. 编译失败后自动单线程重试
      # ============================================================
      - name: Retry Compile
        if: failure()
        working-directory: openwrt
        run: |
          echo "========================================"
          echo "Parallel compilation failed."
          echo "Retrying with single thread..."
          echo "========================================"

          make -j1 V=s

      # ============================================================
      # 21. 查找固件
      # ============================================================
      - name: Find Firmware
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "ALL FIRMWARE"
          echo "========================================"

          find bin/targets/airoha/an7583 \
            -type f \
            2>/dev/null | sort

          echo "========================================"
          echo "XG-040G-MF"
          echo "========================================"

          find bin/targets/airoha/an7583 \
            -type f \
            \( \
              -iname '*xg-040g-mf*' \
              -o \
              -iname '*xg-040g-mf*ubi*' \
            \) \
            2>/dev/null | sort

      # ============================================================
      # 22. 准备发布文件
      # ============================================================
      - name: Prepare Release Files
        working-directory: openwrt
        run: |

          set -e

          rm -rf /tmp/mf-release
          mkdir -p /tmp/mf-release

          echo "Searching firmware files..."

          find bin/targets/airoha/an7583 \
            -type f \
            \( \
              -iname '*xg-040g-mf*' \
              -o \
              -iname '*xg-040g-mf*ubi*' \
            \) \
            -exec cp {} /tmp/mf-release/ \;

          cd /tmp/mf-release

          if [ "$(find . -type f | wc -l)" -eq 0 ]; then
              echo "ERROR: No XG-040G-MF firmware found."
              exit 1
          fi

          sha256sum * > sha256sums.txt

          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          ls -lh

      # ============================================================
      # 23. 上传 MF 固件
      # ============================================================
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-MF-UBI
          path: /tmp/mf-release/
          retention-days: 30

      # ============================================================
      # 24. 上传完整 bin 目录
      # ============================================================
      - name: Upload Full Bin
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-MF-full-bin
          path: openwrt/bin/targets/airoha/an7583/
          retention-days: 7
