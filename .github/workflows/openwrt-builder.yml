name: Build Nokia XG-040G-MF UBI

on:
  workflow_dispatch:

  

  schedule:
    # 每周日北京时间凌晨 3 点
    # 北京时间 UTC+8
    # GitHub Actions 使用 UTC
    - cron: "0 19 * * 6"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Nokia XG-040G-MF UBI
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 检出自己的仓库
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 清理 GitHub Actions 磁盘空间
      # ============================================================
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ============================================================
      # 3. 安装编译环境
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            swig \
            time \
            libelf-dev \
            device-tree-compiler

      # ============================================================
      # 4. 获取 OpenWrt 最新源码
      #
      # Nokia XG-040G-MF UBI
      # Airoha AN7583
      # ============================================================
      - name: Clone OpenWrt
        run: |
          set -e

          echo "========================================"
          echo "Clone OpenWrt"
          echo "========================================"

          rm -rf openwrt

          git clone \
            --depth=1 \
            --branch master \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          echo "========================================"
          echo "OpenWrt Commit"
          echo "========================================"

          git log -1 --oneline

          test -f Makefile

          echo "OpenWrt clone completed successfully."

      # ============================================================
      # 5. 添加 PassWall
      # ============================================================
      - name: Add PassWall Feeds
        working-directory: openwrt
        run: |
          set -e

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main

          EOF

      # ============================================================
      # 6. 添加 iStore
      # ============================================================
      - name: Add iStore Feed
        working-directory: openwrt
        run: |
          set -e

          cat >> feeds.conf.default <<'EOF'

          src-git istore https://github.com/linkease/istore.git;main

          EOF

      # ============================================================
      # 7. 更新并安装 feeds
      # ============================================================
      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          set -e

          ./scripts/feeds clean

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          echo "========================================"
          echo "Feeds installed"
          echo "========================================"

      # ============================================================
      # 8. 添加 Lucky
      # ============================================================
      - name: Add Lucky
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/lucky

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/lucky

      # ============================================================
      # 9. 添加 OpenAppFilter
      # ============================================================
      - name: Add OpenAppFilter
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/OpenAppFilter

          git clone \
            --depth=1 \
            https://github.com/destan19/OpenAppFilter.git \
            package/OpenAppFilter

      # ============================================================
      # 10. 添加 OpenClash
      # ============================================================
      - name: Add OpenClash
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-app-openclash
          rm -rf /tmp/OpenClash

          git clone \
            --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          cp -rf \
            /tmp/OpenClash/luci-app-openclash \
            package/luci-app-openclash

          rm -rf /tmp/OpenClash

      # ============================================================
      # 11. 添加 Argon
      # ============================================================
      - name: Add Argon Theme
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/luci-theme-argon
          rm -rf package/luci-app-argon-config

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/luci-theme-argon

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/luci-app-argon-config

      # ============================================================
      # 12. 添加 QuickFile
      #
      # QuickFile 官方源码：
      # luci-app-quickfile
      # quickfile
      #
      # QuickFile 依赖 nginx/luci-nginx
      # ============================================================
      - name: Add QuickFile
        working-directory: openwrt
        run: |
          set -e

          rm -rf package/quickfile

          git clone \
            --depth=1 \
            https://github.com/sbwml/luci-app-quickfile.git \
            package/quickfile

          echo "========================================"
          echo "QuickFile"
          echo "========================================"

          find package/quickfile \
            -maxdepth 3 \
            -name Makefile \
            -print

      # ============================================================
      # 13. 检查插件
      # ============================================================
      - name: Verify Packages
        working-directory: openwrt
        run: |
          set -e

          echo "========================================"
          echo "PASSWALL"
          echo "========================================"

          find package/feeds \
            -maxdepth 5 \
            -type f \
            -name Makefile \
            -path '*passwall*' \
            2>/dev/null || true

          echo "========================================"
          echo "iStore"
          echo "========================================"

          find package/feeds/istore \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

          echo "========================================"
          echo "Lucky"
          echo "========================================"

          find package/lucky \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

          echo "========================================"
          echo "OpenClash"
          echo "========================================"

          find package/luci-app-openclash \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

          echo "========================================"
          echo "QuickFile"
          echo "========================================"

          find package/quickfile \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

          echo "========================================"
          echo "Argon"
          echo "========================================"

          find package/luci-theme-argon \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            2>/dev/null || true

      # ============================================================
      # 14. 生成 Nokia XG-040G-MF UBI 配置
      # ============================================================
      - name: Generate XG-040G-MF UBI Config
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          #
          # ==========================================================
          # Nokia XG-040G-MF UBI
          # Airoha AN7583
          # ==========================================================
          #

          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7583=y
          CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y

          #
          # ==========================================================
          # Root filesystem
          # ==========================================================
          #

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          #
          # ==========================================================
          # LuCI
          # ==========================================================
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          #
          # ==========================================================
          # Argon
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          #
          # ==========================================================
          # iStore
          # ==========================================================
          #

          ./scripts/feeds update istore
          ./scripts/feeds install -d y -p istore luci-app-store

          #
          # ==========================================================
          # PassWall
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y

          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          #
          # ==========================================================
          # OpenClash
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-openclash=y

          #
          # ==========================================================
          # Lucky
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-lucky=y

          #
          # ==========================================================
          # Tailscale
          #
          # 使用 OpenWrt 官方 tailscale 软件包
          # ==========================================================
          #

          CONFIG_PACKAGE_tailscale=y

          #
          # ==========================================================
          # QuickFile
          #
          # QuickFile 
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-quickfile=y

          #
          # ==========================================================
          # OpenAppFilter
          # ==========================================================
          #

          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_kmod-oaf=y

          #
          # ==========================================================
          # Network / Proxy
          # ==========================================================
          #

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y

          #
          # ==========================================================
          # DNS
          # ==========================================================
          #

          CONFIG_PACKAGE_dnsmasq-full=y

          #
          # ==========================================================
          # USB
          # ==========================================================
          #

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_usbutils=y

          #
          # ==========================================================
          # Storage / Filesystem
          # ==========================================================
          #

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y

          #
          # ==========================================================
          # Basic tools
          # ==========================================================
          #

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_mtr=y
          CONFIG_PACKAGE_htop=y

          #
          # ==========================================================
          # SSL
          # ==========================================================
          #

          CONFIG_PACKAGE_openssl-util=y

          EOF

      # ============================================================
      # 15. 验证 MF UBI Profile
      # ============================================================
      - name: Verify XG-040G-MF UBI Target
        working-directory: openwrt
        run: |
          set -e

          echo "========================================"
          echo "Checking Nokia XG-040G-MF UBI"
          echo "========================================"

          grep -R \
            "nokia_xg-040g-mf-ubi" \
            target/linux/airoha \
            2>/dev/null

          echo "========================================"
          echo "Checking DTS"
          echo "========================================"

          find target/linux/airoha \
            -type f \
            \( \
              -iname '*xg-040g-mf*' \
              -o \
              -iname '*an7583-nokia*' \
            \) \
            -print

          echo "========================================"
          echo "Checking Image Definition"
          echo "========================================"

          grep -n -A25 -B5 \
            "Device/nokia_xg-040g-mf-ubi" \
            target/linux/airoha/image/an7583.mk

          echo "========================================"
          echo "Checking Config"
          echo "========================================"

          grep \
            "CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi" \
            .config

      # ============================================================
      # 16. 默认网络配置
      #
      # LAN1 = WAN
      # LAN2 + LAN3 + LAN4 = LAN
      #
      # IP:
      # 192.168.6.1
      #
      # Hostname:
      # OpenWrt
      #
      # Password:
      # password
      # ============================================================
      - name: Add Default Network Config
        working-directory: openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-xg040g-mf-defaults <<'EOF'
          #!/bin/sh

          #
          # ==================================================
          # Nokia XG-040G-MF UBI
          # Default configuration
          # ==================================================
          #

          #
          # --------------------------------------------------
          # LAN IP
          # --------------------------------------------------
          #

          uci set network.lan.ipaddr='192.168.6.1'
          uci set network.lan.netmask='255.255.255.0'

          #
          # --------------------------------------------------
          # WAN = LAN1
          # LAN = LAN2 + LAN3 + LAN4
          # --------------------------------------------------
          #

          uci -q delete network.wan

          uci set network.wan='interface'
          uci set network.wan.device='lan1'
          uci set network.wan.proto='dhcp'

          #
          # --------------------------------------------------
          # Create LAN bridge
          # --------------------------------------------------
          #

          uci -q delete network.br_lan

          uci set network.br_lan='device'
          uci set network.br_lan.name='br-lan'
          uci set network.br_lan.type='bridge'

          uci add_list network.br_lan.ports='lan2'
          uci add_list network.br_lan.ports='lan3'
          uci add_list network.br_lan.ports='lan4'

          uci set network.lan.device='br-lan'

          #
          # --------------------------------------------------
          # DHCP
          # --------------------------------------------------
          #

          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='150'
          uci set dhcp.lan.leasetime='12h'

          #
          # --------------------------------------------------
          # Hostname
          # --------------------------------------------------
          #

          uci set system.@system[0].hostname='OpenWrt'

          #
          # --------------------------------------------------
          # Root password
          # --------------------------------------------------
          #

          echo 'root:password' | chpasswd

          #
          # --------------------------------------------------
          # Commit
          # --------------------------------------------------
          #

          uci commit system
          uci commit network
          uci commit dhcp

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/99-xg040g-mf-defaults

      # ============================================================
      # 17. 设置 Argon 默认主题
      # ============================================================
      - name: Set Argon Default Theme
        working-directory: openwrt
        run: |

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/98-argon-default-theme <<'EOF'
          #!/bin/sh

          if [ -f /etc/config/luci ]; then

              uci set luci.main.mediaurlbase='/luci-static/argon'

              uci commit luci

          fi

          exit 0
          EOF

          chmod +x \
            files/etc/uci-defaults/98-argon-default-theme

      # ============================================================
      # 18. QuickFile nginx 配置
      #
      # QuickFile 官方要求 nginx/luci-nginx。
      #
      # 这里不主动覆盖 OpenWrt LuCI 的默认 nginx 配置，
      # 只确保 quickfile 包正常进入固件。
      # ============================================================
      - name: Verify QuickFile Configuration
        working-directory: openwrt
        run: |
          set -e

          echo "========================================"
          echo "QuickFile Makefiles"
          echo "========================================"

          find package/quickfile \
            -type f \
            -name Makefile \
            -print

          echo "========================================"
          echo "QuickFile Dependencies"
          echo "========================================"

          grep -R \
            "LUCI_DEPENDS\|DEPENDS" \
            package/quickfile \
            2>/dev/null || true

      # ============================================================
      # 19. Make Defconfig
      # ============================================================
      - name: Make Defconfig
        working-directory: openwrt
        run: |
          set -e

          make defconfig

      # ============================================================
      # 20. 最终检查配置
      # ============================================================
      - name: Show Final Config
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config || true

          echo "========================================"
          echo "NOKIA XG-040G-MF UBI"
          echo "========================================"

          grep \
            'CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi' \
            .config || true

          echo "========================================"
          echo "iStore"
          echo "========================================"

          grep \
            'CONFIG_PACKAGE_luci-app-store' \
            .config || true

          echo "========================================"
          echo "PASSWALL"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box|geoview|v2ray-geoip|v2ray-geosite)' \
            .config || true

          echo "========================================"
          echo "OPENCLASH"
          echo "========================================"

          grep \
            'CONFIG_PACKAGE_luci-app-openclash' \
            .config || true

          echo "========================================"
          echo "LUCKY"
          echo "========================================"

          grep \
            'CONFIG_PACKAGE_luci-app-lucky' \
            .config || true

          echo "========================================"
          echo "TAILSCALE"
          echo "========================================"

          grep \
            'CONFIG_PACKAGE_tailscale' \
            .config || true

          echo "========================================"
          echo "QUICKFILE"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(luci-app-quickfile|quickfile|luci-nginx|nginx)' \
            .config || true

          echo "========================================"
          echo "ARGON"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_luci-(theme-argon|app-argon-config)' \
            .config || true

          echo "========================================"
          echo "OPENAPPFILTER"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(luci-app-oaf|appfilter|kmod-oaf)' \
            .config || true

          echo "========================================"
          echo "USB"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(kmod-usb2|kmod-usb3|usbutils|block-mount)' \
            .config || true

      # ============================================================
      # 21. 下载源码包
      # ============================================================
      - name: Download Sources
        working-directory: openwrt
        run: |
          set -e

          make download -j$(nproc) V=s

      # ============================================================
      # 22. 编译
      # ============================================================
      - name: Compile Firmware
        working-directory: openwrt
        run: |
          set -e

          make -j$(nproc) V=s BUILD_LOG=1

      # ============================================================
      # 23. 编译失败后自动单线程重试
      # ============================================================
      - name: Retry Compile
        if: failure()
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "Parallel compilation failed."
          echo "Retrying with single thread..."
          echo "========================================"

          make -j1 V=s

      # ============================================================
      # 24. 查找固件
      # ============================================================
      - name: Find Firmware
        working-directory: openwrt
        run: |

          echo "========================================"
          echo "ALL AN7583 FIRMWARE"
          echo "========================================"

          find \
            bin/targets/airoha/an7583 \
            -type f \
            2>/dev/null | sort

          echo "========================================"
          echo "NOKIA XG-040G-MF UBI"
          echo "========================================"

          find \
            bin/targets/airoha/an7583 \
            -type f \
            \( \
              -iname '*xg-040g-mf-ubi*' \
              -o \
              -iname '*sysupgrade.itb' \
              -o \
              -iname '*recovery.itb' \
              -o \
              -iname '*bl31-uboot.fip' \
              -o \
              -iname '*preloader.bin' \
            \) \
            2>/dev/null | sort

      # ============================================================
      # 25. 准备 MF UBI 发布文件
      # ============================================================
      - name: Prepare Release Files
        working-directory: openwrt
        run: |

          set -e

          rm -rf /tmp/mf-ubi-release

          mkdir -p /tmp/mf-ubi-release

          echo "========================================"
          echo "Searching MF UBI firmware"
          echo "========================================"

          #
          # MF UBI 的核心固件
          #
          find \
            bin/targets/airoha/an7583 \
            -type f \
            -name '*sysupgrade.itb' \
            -exec cp {} /tmp/mf-ubi-release/ \;

          #
          # Recovery / boot artifacts
          #
          find \
            bin/targets/airoha/an7583 \
            -type f \
            \( \
              -name '*recovery.itb' \
              -o \
              -name '*bl31-uboot.fip' \
              -o \
              -name '*preloader.bin' \
            \) \
            -exec cp {} /tmp/mf-ubi-release/ \;

          cd /tmp/mf-ubi-release

          echo "========================================"
          echo "Release files"
          echo "========================================"

          ls -lh

          if [ "$(find . -type f | wc -l)" -eq 0 ]; then

              echo "ERROR:"
              echo "No MF UBI firmware was found."

              exit 1

          fi

          sha256sum * > sha256sums.txt

          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cat sha256sums.txt

      # ============================================================
      # 26. 上传 MF UBI 固件
      # ============================================================
      - name: Upload MF UBI Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-MF-UBI
          path: /tmp/mf-ubi-release/
          retention-days: 30

      # ============================================================
      # 27. 上传完整 bin
      # ============================================================
      - name: Upload Full Bin
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-MF-UBI-full-bin
          path: openwrt/bin/targets/airoha/an7583/
          retention-days: 7

      # ============================================================
      # 28. 上传编译日志
      # ============================================================
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-XG-040G-MF-UBI-build-logs
          path: |
            openwrt/logs/
            openwrt/tmp/
          retention-days: 7
```
